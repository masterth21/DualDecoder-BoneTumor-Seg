############################################################################
# CẤU HÌNH TỐI ƯU CHO U-NET++ VỚI BACKBONE RESNET34
# Mục tiêu: Dice Score ~0.78-0.80 cho phân đoạn u xương
# Được kiểm tra: Tháng 5 năm 2026
############################################################################

WORK_DIR: ${hydra:runtime.cwd}

DATA_PREPARATION:
  SCANS_TRAIN_DATA_PATH: "/data/Training Batch 2/"
  SCANS_VAL_DATA_PATH: "/data/Training Batch 1/"
  RESIZED_HEIGHT: ${INPUT.HEIGHT}
  RESIZED_WIDTH: ${INPUT.WIDTH}
  SCAN_MIN_VALUE: -200
  SCAN_MAX_VALUE: 250

DATA:
  OVERSAMPLE_MALIGNANT: 1.0  # 1.0 = tắt. >1.0 lặp ảnh có u ác trong TRAIN

DATASET:
  TRAIN:
    IMAGES_PATH: "./BTXRD/Split/train/images"
    MASK_PATH: "./BTXRD/Split/train/mask"
  VAL:
    IMAGES_PATH: "./BTXRD/Split/val/images"
    MASK_PATH: "./BTXRD/Split/val/mask"
  TEST:
    IMAGES_PATH: "./BTXRD/Split/test/images"
    MASK_PATH: "./BTXRD/Split/test/mask"

# ============ CẤU HÌNH MÔ HÌNH ============
MODEL:
  # Các tùy chọn TYPE: "dual_decoder_resnet", "unet_plus_plus", "hybrid_transunet", "unet3plus"
  TYPE: "dual_decoder_resnet"
  DUAL_DECODER: true            # false = M0: chỉ 1 nhánh Region
  DECODER:
    TYPE: "unet3plus"           # "unet" = decoder cũ, giữ nguyên tên layer
    CAT_CHANNELS_REGION: 64     # kênh cho UNet3+ region
    CAT_CHANNELS_BOUNDARY: 32   # kênh cho UNet3+ boundary
  WEIGHTS_FILE_NAME: "model_dual_decoder_resnet_optimal"
  BACKBONE:
    # ResNet34 / ResNet50V2: Trích xuất đặc trưng đa tầng cho 2 nhánh Region & Boundary
    TYPE: "resnet34"
    WEIGHTS: "imagenet"
  
  # Cấu hình Attention:
  SKIP_ATTENTION:
    REGION:
      TYPE: "nalaformer"
      STAGES: [3, 4]
    BOUNDARY:
      TYPE: "oktay"
      STAGES: [3, 4]

  # 2. Loại Attention tại Bottleneck (12x12) (tùy chọn: "nalaformer", "multipole", "log_linear", "none")
  BOTTLENECK_ATTENTION: "none"
  FUSION_REFINEMENT: true       # false = bỏ Fusion + Refinement
  REFINEMENT: true              # false = giữ Fusion, bỏ Refinement (R2)
  SDF:
    ENABLE: false               # true = thêm head SDF (u nhị phân) trên nhánh Boundary (chỉ khi DUAL_DECODER=true)
  CLS_HEAD:
    ENABLE: false               # true = thêm head phân loại cấp ảnh (bình thường / lành / ác) trên bottleneck
    DROPOUT: 0.3

# ============ TẢI DỮ LIỆU ============
DATA_GENERATOR_TYPE: "TF_GENERATOR"  # TF_GENERATOR ổn định, DALI cho tốc độ
SEED: 42  # Tái tạo lại kết quả
VERBOSE: 1
DATALOADER_WORKERS: 4  # Tăng để hiệu suất tốt hơn

# ============ THÔNG SỐ ĐẦU VÀO/ĐẦU RA ============
INPUT:
  HEIGHT: 384  # Tăng từ 320 để bắt chi tiết tốt hơn
  WIDTH: 384
  CHANNELS: 3

OUTPUT:
  CLASSES: 3   # 0: Không u (Nền), 1: U lành, 2: U ác

BOUNDARY:
  KERNEL_SIZE: 5     # số lẻ; độ dày dải biên = KERNEL_SIZE - 1 pixel ở 384x384 (5 -> 4 px)
  EVAL_TOL: 2        # dung sai (pixel) khi chấm Boundary F1
  MODE: "class"      # "class" = 1 kênh biên/lớp (như cũ) | "binary" = 1 kênh, biên u nhị phân (lành ∪ ác)
  POS_WEIGHT: 1.0    # pos_weight cho BCE biên (chỉ dùng ở mode binary)

SDF:
  TRUNC: 20          # cắt khoảng cách ±20 px (ở 384x384)
  NEAR_PX: 5         # vùng gần biên được nhân trọng số
  NEAR_WEIGHT: 5.0
  HUBER_DELTA: 0.1   # SmoothL1


# ============ SIÊU THÔNG SỐ - ĐƯỢC ĐIỀU CHỈNH TỐI ƯU ============
HYPER_PARAMETERS:
  EPOCHS: 200  # Tăng để mô hình hội tụ
  BATCH_SIZE: 2  # Tối ưu cho GPU 8GB
  LEARNING_RATE: 1e-4  # LR 1e-4 chuẩn cho Adam giúp hội tụ nhanh khỏi bẫy nền
  
  # Tối ưu hóa nâng cao
  GRADIENT_CLIP: 1.0  # Cắt gradient để tránh bùng nổ
  WEIGHT_DECAY: 1e-5  # Chính quy hóa L2

# ============ CALLBACK VÀ GIÁM SÁT ============
CALLBACKS:
  TENSORBOARD:
    PATH: "checkpoint/tb_logs"

  EARLY_STOPPING:
    PATIENCE: 20  # Dừng sớm sau 20 epoch nếu không cải thiện
    MIN_DELTA: 1e-4  # Ngưỡng cải tiến tối thiểu

  MODEL_CHECKPOINT:
    PATH: "checkpoint"
    SAVE_WEIGHTS_ONLY: True
    SAVE_BEST_ONLY: True

  CSV_LOGGER:
    PATH: "checkpoint"
    APPEND_LOGS: False

  # Giảm Learning Rate khi loss không cải thiện
  REDUCE_LR_ON_PLATEAU:
    MONITOR: "val_refined_output_dice_coef"
    FACTOR: 0.5  # Giảm LR xuống 1/2
    PATIENCE: 8   # Sau 8 epoch không cải thiện thì giảm LR
    MIN_LR: 1e-7
    VERBOSE: 1

# ============ XỬ LÝ & TĂNG CƯỜNG DỮ LIỆU ============
PREPROCESS_DATA:
  RESIZE:
    VALUE: True  # QUAN TRỌNG: Luôn resize về kích thước mô hình
    HEIGHT: ${INPUT.HEIGHT}
    WIDTH: ${INPUT.WIDTH}

  IMAGE_PREPROCESSING_TYPE: "normalize"  # Chuẩn hóa về [0, 1]

  NORMALIZE_MASK:
    VALUE: True
    NORMALIZE_VALUE: 255

  SHUFFLE:
    TRAIN:
      VALUE: True
    VAL:
      VALUE: False

# ============ TĂNG CƯỜNG DỮ LIỆU (DATA AUGMENTATION) ============
DATA_AUGMENTATION:
  ENABLE: True
  PRESET: "medium"  # none | light | medium
  MAX_TUMOR_LOSS: 0.10


# ============ GPU & TỐI ƯU HÓA ============
USE_MULTI_GPUS:
  VALUE: False  # Đặt thành True nếu có nhiều GPU
  GPU_IDS: -1

OPTIMIZATION:
  AMP: True   # Độ chính xác hỗn hợp tự động - nhanh hơn 2-3 lần (GPU Tensor Cores)
  XLA: False  # Tắt XLA để tránh lỗi libdevice.10.bc trên môi trường Conda/Linux

# ============ HÀM MẤT ============
LOSS:
  WEIGHTS:            # trọng số loss từng đầu ra
    REGION: 0.5
    BOUNDARY: 1.0     # λ_b
    REFINED: 1.0
    SDF: 0.5          # chỉ dùng khi MODEL.SDF.ENABLE=true
    CLS: 0.5          # chỉ dùng khi MODEL.CLS_HEAD.ENABLE=true

CLS:
  CLASS_WEIGHTS: [1.0, 1.0, 2.0]   # trọng số CE cấp ảnh [bình thường, lành, ác]

LOSS_CONFIG:
  TYPE: "weighted_dice_loss"  # Xử lý mất cân bằng lớp
  # WEIGHTS: [0.1, 0.4, 0.5]    # [Nền, U lành, U ác]
  WEIGHTS: [0.1, 0.9]    # [Nền, U]


# ============ CẤU HÌNH HYDRA ============
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
